name: Deploy to GitHub Pages

on:
  # Deploy a ogni push su main
  push:
    branches: [main]
  # Permette il lancio manuale dalla tab Actions
  workflow_dispatch:

# Permessi necessari per il deploy su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; non annullare un deploy in corso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # Auto-rileva npm da package-lock.json, esegue `astro build`
        # e carica ./dist come artifact di Pages.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
