name: Deploy su Cloudflare Pages

# Ogni push su main ripubblica il sito: modifichi un file di contenuto,
# fai push, e in un minuto è online. Senza questo, i deploy andrebbero
# lanciati a mano da un computer con wrangler installato.
on:
  push:
    branches: [main]
  workflow_dispatch: # permette di lanciarlo a mano dalla scheda Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pubblica su Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=quartetto-site --branch=main
